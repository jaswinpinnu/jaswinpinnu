<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Jaswin Pinnu — Full Stack Developer</title>
<desc id="desc">Animated dark burgundy and charcoal developer banner with Jaswin Pinnu portrait on the right and Full Stack Developer, AI and Machine Learning text on the left.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#09090d"/><stop offset=".55" stop-color="#21101b"/><stop offset="1" stop-color="#09090d"/>
  </linearGradient>
  <radialGradient id="glow"><stop stop-color="#a83f68" stop-opacity=".38"/><stop offset="1" stop-color="#a83f68" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#7b294b" stop-opacity="0"/><stop offset=".5" stop-color="#e08aaa"/><stop offset="1" stop-color="#7b294b" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  <clipPath id="portraitClip"><circle cx="1005" cy="174" r="112"/></clipPath>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<circle cx="960" cy="110" r="240" fill="url(#glow)" filter="url(#blur)"/>
<circle cx="150" cy="330" r="170" fill="url(#glow)" filter="url(#blur)"/>
<g fill="none" stroke="#b75b7e" stroke-opacity=".2">
  <path d="M760 40 C900 150 930 210 1180 270"/><path d="M720 0 C860 120 930 190 1200 230"/>
  <path d="M0 290 C260 220 350 230 560 360"/>
  <circle cx="1005" cy="174" r="125" stroke-dasharray="3 12"/>
  <circle cx="1005" cy="174" r="168" stroke-dasharray="2 16"/>
</g>
<!-- Portrait placed beside the introduction -->
<circle cx="1005" cy="174" r="124" fill="#3a1728" opacity=".8"/>
<image href="jaswin-pinnu.png" x="893" y="62" width="224" height="224"
       preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)"/>
<circle cx="1005" cy="174" r="116" fill="none" stroke="#d17a9b" stroke-width="3"/>
<circle cx="1005" cy="174" r="128" fill="none" stroke="#b75b7e" stroke-opacity=".55" stroke-dasharray="3 9">
  <animateTransform attributeName="transform" type="rotate" from="0 1005 174" to="360 1005 174" dur="36s" repeatCount="indefinite"/>
</circle>
<path d="M70 286 H1130" stroke="url(#line)" stroke-width="1"/>
<g font-family="Segoe UI, Arial, sans-serif">
  <text x="84" y="88" fill="#d88ba7" font-size="15" letter-spacing="5">JASWIN PINNU  /  PORTFOLIO</text>
  <text x="80" y="165" fill="#fff7fa" font-size="57" font-weight="700" letter-spacing="-1">Building for the web.</text>
  <text x="84" y="211" fill="#d9c4cd" font-size="23">Full Stack Developer  ·  AI &amp; Machine Learning</text>
  <text x="84" y="254" fill="#b9869a" font-size="15" letter-spacing="2">JAVASCRIPT  /  FIREBASE  /  JAVA  /  COMPUTER VISION</text>
</g>
<g>
  <circle cx="1005" cy="174" r="7" fill="#f2a7c1">
    <animate attributeName="r" values="6;10;6" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".65;1;.65" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1005" cy="174" r="25" fill="none" stroke="#d66b93" stroke-opacity=".7">
    <animate attributeName="r" values="18;42;18" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;0;.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1137" cy="65" r="3" fill="#f1b6cb"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="878" cy="285" r="3" fill="#f1b6cb"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
</svg>